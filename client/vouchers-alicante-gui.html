<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Vouchers Balneario Alicante</title>
    <link rel="stylesheet" href="src/styles.css">
    <style>
        .drop{border:2px dashed #888;padding:30px;text-align:center;margin:20px auto;cursor:pointer;max-width:600px;border-radius:8px;background:#fafafa}
        .drop:hover{background:#f0f0f0;border-color:#555}
        .drop input[type="file"]{margin-top:8px}
        .drop.loaded{border-color:#28a745;background:#f1fbf3}
    </style>
</head>
<body>
    <div class="header-container">
        <div class="logo-initial">
            <img src="../assets/suteba_logo_3.jpg" alt="Logo" style="width: 100px;">
        </div>
        <h1 class="h1-initial">Generador de Vouchers de Balneario</h1>
        <h2 class="h2-initial">Balneario Alicante</h2>

        <div style="text-align: center; margin: 10px 0;">
            <a href="../index.html" style="padding: 8px 16px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; transition: background-color 0.3s;" onmouseover="this.style.backgroundColor='#5a6268'" onmouseout="this.style.backgroundColor='#6c757d'">⬅️ Volver al Menú</a>
        </div>

        <div id="status" style="text-align:center; margin:12px auto; min-height:22px; max-width:720px;"></div>

        <div class="drop" id="dropArea">
            📂 Arrastra un archivo CSV aquí, o <input type="file" id="csvInput" accept=".csv" />
        </div>
    </div>

    <div id="resultContainer">
        <div class="print-buttons-container">
            <button class="print-button" id="generateBtn" type="button" disabled>
                <span>🖨️</span> Generar vouchers
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="js/vouchersAlicanteGui.js"></script>
</body>
</html>
