<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Diario de Balneario</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f4f4;
            color: #333;
        }

        .site-header {
            padding: 16px 24px 8px;
            text-align: center;
        }

        .site-logo {
            width: 100px;
            object-fit: contain;
        }

        .site-header h1 {
            margin: 8px 0 4px;
            font-size: 24px;
        }

        .site-header h2 {
            margin: 0 0 10px;
            font-size: 16px;
            font-weight: 400;
            color: #666;
        }

        .home-link {
            display: inline-block;
            padding: 8px 16px;
            background: #6c757d;
            color: #fff;
            border-radius: 5px;
            font-size: 14px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .home-link:hover { background: #5a6268; }

        .home-link:focus-visible {
            outline: 3px solid #80bdff;
            outline-offset: 3px;
        }

        main {
            width: min(640px, calc(100% - 32px));
            margin: 20px auto 28px;
        }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            padding: 28px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .intro {
            margin: 0 0 24px;
            color: #666;
        }

        form {
            display: grid;
            gap: 16px;
        }

        label {
            display: grid;
            gap: 6px;
            font-weight: 700;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #c8cdd2;
            border-radius: 4px;
            padding: 11px 12px;
            font: inherit;
        }

        select { background: #fff; }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            border: 0;
            border-radius: 4px;
            padding: 12px 18px;
            background: #007bff;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { background: #0056b3; }

        #status {
            min-height: 24px;
            margin-top: 18px;
            color: #007bff;
        }

        #status.error { color: #a52727; }

        @media (max-width: 560px) {
            main { margin: 16px auto; }
            .card { padding: 20px; }
            .two-columns { grid-template-columns: 1fr; }
        }

    </style>
</head>
<body>
    <header class="site-header">
        <img class="site-logo" src="../assets/suteba_logo_3.jpg" alt="SUTEBA">
        <h1>Voucher Diario de Balneario</h1>
        <h2>Balneario Alicante</h2>
        <a class="home-link" href="../index.html">&#11013;&#65039; Volver al Menú</a>
    </header>
    <main>
        <section class="card">
            <p class="intro">Completa los datos para generar el voucher diario.</p>

            <form id="balnearioVoucherForm">
                <label>
                    Nombre y apellido
                    <input id="nombre" name="nombre" type="text" autocomplete="name" required>
                </label>

                <div class="two-columns">
                    <label>
                        DNI
                        <input id="dni" name="dni" type="text" inputmode="numeric" autocomplete="off" required>
                    </label>

                    <label>
                        Hotel
                        <select id="hotel" name="hotel" required>
                            <option value="23 DE MAYO" selected>23 de Mayo</option>
                            <option value="31 DE AGOSTO">31 de Agosto</option>
                        </select>
                    </label>
                </div>

                <label>
                    Habitación
                    <input id="habitacion" name="habitacion" type="text" autocomplete="off">
                </label>

                <label>
                    Fecha
                    <input id="fecha" name="fecha" type="date" required>
                </label>

                <label>
                    Cantidad de personas
                    <input id="cantidadPersonas" name="cantidadPersonas" type="number" min="1" step="1" value="1" required>
                </label>

                <button type="submit">Generar voucher</button>
            </form>
            <p id="status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="js/balnearioVoucher.js"></script>
</body>
</html>
